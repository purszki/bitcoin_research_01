# Bitcoin Core config for Mainnet data extraction

# Enable RPC server
server=1

# RPC authentication (used by extract_bitcoin_data.py)
rpcuser=lightclient
rpcpassword=replace_with_a_strong_password

[main]
# Restrict RPC exposure to localhost (mainnet section)
rpcbind=127.0.0.1
rpcallowip=127.0.0.1

# Mainnet RPC port
rpcport=8332

# Required for getblockfilter RPC (BIP-158)
blockfilterindex=1

# Recommended for broader research queries and reproducibility
txindex=1

# Keep full chain data (avoid pruning for benchmark datasets)
prune=0

# Optional: log timestamps for easier debugging
logtimestamps=1

# Optional: reduce disk by disabling wallet if not needed
disablewallet=1
